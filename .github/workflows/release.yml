name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep -E '^val appVersionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read appVersionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Stop if the tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.version.outputs.tag }} is already published. Bump appVersionName and appVersionCode to cut a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        if: steps.tag.outputs.exists == 'false'
        run: ./gradlew testDebugUnitTest --stacktrace

      # The `secrets` context cannot be used in an `if:` condition, so its
      # presence is turned into a step output first.
      - name: Check signing configuration
        if: steps.tag.outputs.exists == 'false'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set, so no release will be published. See docs/RELEASING.md."
          fi

      - name: Decode the keystore
        if: steps.tag.outputs.exists == 'false' && steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        if: steps.tag.outputs.exists == 'false' && steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract the changelog entry
        if: steps.tag.outputs.exists == 'false' && steps.signing.outputs.available == 'true'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Stops at the next version heading, and also at the link reference
          # block that closes the file, which the last section would otherwise
          # swallow because nothing follows it.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:[[:space:]]*http/ { exit }
            capture { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No changelog entry for $VERSION." > "$RUNNER_TEMP/notes.md"
          fi

      - name: Publish the GitHub release
        if: steps.tag.outputs.exists == 'false' && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            app/build/outputs/apk/release/*.apk

      - name: Clean up the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
