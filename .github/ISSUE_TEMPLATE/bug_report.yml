name: Bug report
description: Something in the app does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: does the same thing happen in Chrome on this phone, pointed at the same
        server? If it does, it is a SiYuan or a server issue rather than an app issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: webview-version
    attributes:
      label: Android System WebView version
      description: Settings → About
      placeholder: "131.0.6778.135"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "Android 14, Pixel 7"
    validations:
      required: true
  - type: input
    id: kernel-version
    attributes:
      label: SiYuan kernel version and how it is deployed
      placeholder: "3.1.20, Docker behind Caddy"
    validations:
      required: true
  - type: checkboxes
    id: browser-check
    attributes:
      label: Cross check
      options:
        - label: I confirmed this does not happen when opening the same server in Chrome on the same phone
